name: Deploy

on:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22.14]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: Setup node env 🏗
        uses: actions/setup-node@v2.1.2
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies 👨🏻‍💻
        run: pnpm i

      - name: Build 🧱
        run: pnpm run build
  deploy:
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 22
        uses: actions/setup-node@v1
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - name: Install PNPM packages locally 🧑🏻‍💻
        run: pnpm i
      - name: Install SSH key 🔑
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'
      - name: Add Server To Known Hosts 🤷‍
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Git pull
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /var/www/app.storywalks.nl && git pull"
      - name: Install dependencies on production server ⏱
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "/root/.local/share/pnpm/pnpm install --prefix /var/www/app.storywalks.nl"
      - name: Run build command
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /var/www/app.storywalks.nl && /root/.local/share/pnpm/pnpm run build"
      - name: Restart Storywalks PM2 Server 🏁
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} pm2 reload cityquest-app
